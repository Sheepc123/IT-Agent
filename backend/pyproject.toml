[project]
name = "it-procurement-api"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Sheepc123", email = "sheepcpro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.162.5",
    "langgraph>=1.2.22",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
it-procurement-api = "it_procurement_api:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
